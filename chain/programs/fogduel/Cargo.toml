[package]
name = "fogduel"
version = "0.1.0"
description = "Fog Duel — hidden-position 1v1 trading on MagicBlock Private Ephemeral Rollups"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fogduel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
light-sdk = { version = "0.25.0", features = ["anchor"] }
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.17.0", features = ["anchor-modern", "access-control", "vrf"] }
# Named directly for `MagicBlockInstruction::ScheduleTask`, which the SDK builds
# but does not re-export. The SDK already enables `backward-compat` on it.
magicblock-magic-program-api = { version = "0.10.1" }
# Gum Session Protocol. The session program (KeyspM2s…) is preloaded by
# mb-test-validator, so a session token can be created and used locally.
session-keys = { version = "3.1.1", features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
